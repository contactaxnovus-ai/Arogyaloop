services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 4000
      DEMO_MODE: ${DEMO_MODE:-true}
    expose:
      - "4000"
    volumes:
      - backend-data:/app/apps/backend/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # The browser and API share this Nginx origin in the production image.
        # Do not pass localhost or a private backend URL into the browser bundle.
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  backend-data:
